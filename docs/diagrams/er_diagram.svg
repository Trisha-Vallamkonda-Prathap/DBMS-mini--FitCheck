<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="1600" height="1150" style="background-color: #FDFCFA; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#29252B" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#75466F" />
    </marker>
    <marker id="circle" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
      <circle cx="5" cy="5" r="3" fill="#29252B" />
    </marker>
  </defs>

  <!-- Title & Header Banner -->
  <rect x="50" y="30" width="1500" height="75" rx="8" fill="#75466F" filter="url(#shadow)"/>
  <text x="80" y="70" font-size="26" font-weight="bold" fill="#F8F6F1">FitCheck — Entity-Relationship (ER) Conceptual Diagram</text>
  <text x="80" y="93" font-size="14" fill="#E8E2D8">DBMS Experiential Learning Level 3 | Hybrid Relational-Vector Clothing Fit Recommendation Engine</text>
  <text x="1350" y="75" font-size="14" font-weight="600" fill="#A7B7A0">MySQL 8.0 + Redis</text>

  <!-- Legend -->
  <rect x="50" y="120" width="1500" height="42" rx="6" fill="#F8F6F1" stroke="#E8E2D8" stroke-width="1.5"/>
  <text x="70" y="146" font-size="13" font-weight="bold" fill="#29252B">Legend:</text>
  <rect x="140" y="132" width="18" height="18" rx="3" fill="#75466F"/>
  <text x="165" y="146" font-size="12" fill="#29252B">Strong Entity</text>
  <rect x="270" y="132" width="18" height="18" rx="3" fill="#A7B7A0"/>
  <text x="295" y="146" font-size="12" fill="#29252B">Dependent / Subordinate Entity</text>
  <rect x="500" y="132" width="18" height="18" rx="3" fill="#DDA18E"/>
  <text x="525" y="146" font-size="12" fill="#29252B">Associative / Transactional Entity</text>
  <text x="750" y="146" font-size="12" fill="#75466F" font-weight="bold">[PK] Primary Key</text>
  <text x="880" y="146" font-size="12" fill="#29252B" font-weight="bold">[FK] Foreign Key</text>
  <text x="1010" y="146" font-size="12" fill="#29252B">1 : 1 (One-to-One)</text>
  <text x="1120" y="146" font-size="12" fill="#29252B">1 : N (One-to-Many)</text>
  <text x="1240" y="146" font-size="12" fill="#75466F">=== Total Participation</text>

  <!-- ================= ENTITY 1: USER (Strong) ================= -->
  <g filter="url(#shadow)">
    <rect x="50" y="190" width="280" height="230" rx="8" fill="#FFFFFF" stroke="#75466F" stroke-width="2"/>
    <rect x="50" y="190" width="280" height="40" rx="8" fill="#75466F"/>
    <rect x="50" y="222" width="280" height="8" fill="#75466F"/>
    <text x="190" y="217" font-size="16" font-weight="bold" fill="#F8F6F1" text-anchor="middle">USER (Strong Entity)</text>
    <text x="70" y="250" font-size="13" font-weight="bold" fill="#75466F">• user_id : INT [PK]</text>
    <text x="70" y="275" font-size="13" fill="#29252B">• name : VARCHAR(100)</text>
    <text x="70" y="300" font-size="13" fill="#29252B">• email : VARCHAR(255) [UQ]</text>
    <text x="70" y="325" font-size="13" fill="#29252B">• password_hash : VARCHAR(255)</text>
    <text x="70" y="350" font-size="13" fill="#29252B">• role : VARCHAR(10) [CHK]</text>
    <text x="70" y="375" font-size="13" fill="#29252B">• created_at : TIMESTAMP</text>
    <rect x="65" y="390" width="250" height="20" rx="4" fill="#F8F6F1"/>
    <text x="190" y="404" font-size="11" fill="#75466F" text-anchor="middle">Role: USER / ADMIN</text>
  </g>

  <!-- ================= ENTITY 2: BODY_PROFILE (Dependent 1:1) ================= -->
  <g filter="url(#shadow)">
    <rect x="420" y="190" width="290" height="270" rx="8" fill="#FFFFFF" stroke="#A7B7A0" stroke-width="2"/>
    <rect x="420" y="190" width="290" height="40" rx="8" fill="#A7B7A0"/>
    <rect x="420" y="222" width="290" height="8" fill="#A7B7A0"/>
    <text x="565" y="217" font-size="15" font-weight="bold" fill="#29252B" text-anchor="middle">BODY_PROFILE (Dependent)</text>
    <text x="440" y="250" font-size="13" font-weight="bold" fill="#75466F">• profile_id : INT [PK]</text>
    <text x="440" y="275" font-size="13" font-weight="bold" fill="#29252B">• user_id : INT [FK, UQ] (CASCADE)</text>
    <text x="440" y="300" font-size="13" fill="#29252B">• height : DECIMAL(5,2) [cm]</text>
    <text x="440" y="325" font-size="13" fill="#29252B">• waist : DECIMAL(5,2) [cm]</text>
    <text x="440" y="350" font-size="13" fill="#29252B">• hip : DECIMAL(5,2) [cm]</text>
    <text x="440" y="375" font-size="13" fill="#29252B">• thigh : DECIMAL(5,2) [cm]</text>
    <text x="440" y="400" font-size="13" fill="#29252B">• inseam : DECIMAL(5,2) [cm]</text>
    <text x="440" y="425" font-size="13" fill="#29252B">• preferred_fit : VARCHAR(20)</text>
    <text x="440" y="448" font-size="12" fill="#75466F">• updated_at : TIMESTAMP</text>
  </g>

  <!-- ================= ENTITY 3: BRAND (Strong) ================= -->
  <g filter="url(#shadow)">
    <rect x="1270" y="190" width="280" height="170" rx="8" fill="#FFFFFF" stroke="#75466F" stroke-width="2"/>
    <rect x="1270" y="190" width="280" height="40" rx="8" fill="#75466F"/>
    <rect x="1270" y="222" width="280" height="8" fill="#75466F"/>
    <text x="1410" y="217" font-size="16" font-weight="bold" fill="#F8F6F1" text-anchor="middle">BRAND (Strong Entity)</text>
    <text x="1290" y="250" font-size="13" font-weight="bold" fill="#75466F">• brand_id : INT [PK]</text>
    <text x="1290" y="280" font-size="13" fill="#29252B">• brand_name : VARCHAR(100) [UQ]</text>
    <text x="1290" y="310" font-size="13" fill="#29252B">• sizing_system : VARCHAR(20)</text>
    <rect x="1285" y="325" width="250" height="22" rx="4" fill="#F8F6F1"/>
    <text x="1410" y="340" font-size="11" fill="#75466F" text-anchor="middle">ALPHA / NUMERIC / WAIST_BASED</text>
  </g>

  <!-- ================= ENTITY 4: GARMENT (Strong) ================= -->
  <g filter="url(#shadow)">
    <rect x="1270" y="420" width="280" height="230" rx="8" fill="#FFFFFF" stroke="#75466F" stroke-width="2"/>
    <rect x="1270" y="420" width="280" height="40" rx="8" fill="#75466F"/>
    <rect x="1270" y="452" width="280" height="8" fill="#75466F"/>
    <text x="1410" y="447" font-size="16" font-weight="bold" fill="#F8F6F1" text-anchor="middle">GARMENT (Strong Entity)</text>
    <text x="1290" y="480" font-size="13" font-weight="bold" fill="#75466F">• garment_id : INT [PK]</text>
    <text x="1290" y="505" font-size="13" font-weight="bold" fill="#29252B">• brand_id : INT [FK]</text>
    <text x="1290" y="530" font-size="13" fill="#29252B">• garment_name : VARCHAR(150)</text>
    <text x="1290" y="555" font-size="13" fill="#29252B">• garment_category : VARCHAR(30)</text>
    <text x="1290" y="580" font-size="13" fill="#29252B">• fit_type : VARCHAR(30) [CHK]</text>
    <text x="1290" y="605" font-size="13" fill="#29252B">• description : TEXT</text>
    <rect x="1285" y="618" width="250" height="20" rx="4" fill="#F8F6F1"/>
    <text x="1410" y="632" font-size="10.5" fill="#75466F" text-anchor="middle">Category: Jeans / Trousers</text>
  </g>

  <!-- ================= ENTITY 5: GARMENT_SIZE (Dependent) ================= -->
  <g filter="url(#shadow)">
    <rect x="850" y="440" width="300" height="180" rx="8" fill="#FFFFFF" stroke="#A7B7A0" stroke-width="2"/>
    <rect x="850" y="440" width="300" height="40" rx="8" fill="#A7B7A0"/>
    <rect x="850" y="472" width="300" height="8" fill="#A7B7A0"/>
    <text x="1000" y="467" font-size="15" font-weight="bold" fill="#29252B" text-anchor="middle">GARMENT_SIZE (Dependent)</text>
    <text x="870" y="505" font-size="13" font-weight="bold" fill="#75466F">• garment_size_id : INT [PK]</text>
    <text x="870" y="535" font-size="13" font-weight="bold" fill="#29252B">• garment_id : INT [FK]</text>
    <text x="870" y="565" font-size="13" fill="#29252B">• size_label : VARCHAR(20)</text>
    <rect x="865" y="585" width="270" height="24" rx="4" fill="#F8F6F1"/>
    <text x="1000" y="601" font-size="11" fill="#75466F" text-anchor="middle">UQ(garment_id, size_label)</text>
  </g>

  <!-- ================= ENTITY 6: GARMENT_MEASUREMENT (Dependent) ================= -->
  <g filter="url(#shadow)">
    <rect x="850" y="700" width="300" height="210" rx="8" fill="#FFFFFF" stroke="#A7B7A0" stroke-width="2"/>
    <rect x="850" y="700" width="300" height="40" rx="8" fill="#A7B7A0"/>
    <rect x="850" y="732" width="300" height="8" fill="#A7B7A0"/>
    <text x="1000" y="727" font-size="15" font-weight="bold" fill="#29252B" text-anchor="middle">GARMENT_MEASUREMENT</text>
    <text x="870" y="760" font-size="13" font-weight="bold" fill="#75466F">• measurement_id : INT [PK]</text>
    <text x="870" y="785" font-size="13" font-weight="bold" fill="#29252B">• garment_size_id : INT [FK] (CASCADE)</text>
    <text x="870" y="810" font-size="13" fill="#29252B">• measurement_type : VARCHAR(20) [CHK]</text>
    <text x="870" y="835" font-size="13" fill="#29252B">• measurement_value : DECIMAL(6,2)</text>
    <text x="870" y="860" font-size="13" fill="#29252B">• unit : VARCHAR(5) [cm / in]</text>
    <rect x="865" y="875" width="270" height="24" rx="4" fill="#F8F6F1"/>
    <text x="1000" y="891" font-size="11" fill="#75466F" text-anchor="middle">Types: waist, hip, thigh, inseam, rise</text>
  </g>

  <!-- ================= ENTITY 7: PURCHASE (Associative) ================= -->
  <g filter="url(#shadow)">
    <rect x="50" y="520" width="310" height="240" rx="8" fill="#FFFFFF" stroke="#DDA18E" stroke-width="2"/>
    <rect x="50" y="520" width="310" height="40" rx="8" fill="#DDA18E"/>
    <rect x="50" y="552" width="310" height="8" fill="#DDA18E"/>
    <text x="205" y="547" font-size="15" font-weight="bold" fill="#29252B" text-anchor="middle">PURCHASE (Associative)</text>
    <text x="70" y="580" font-size="13" font-weight="bold" fill="#75466F">• purchase_id : INT [PK]</text>
    <text x="70" y="605" font-size="13" font-weight="bold" fill="#29252B">• user_id : INT [FK]</text>
    <text x="70" y="630" font-size="13" font-weight="bold" fill="#29252B">• garment_size_id : INT [FK]</text>
    <text x="70" y="655" font-size="13" fill="#29252B">• purchase_date : DATE</text>
    <text x="70" y="680" font-size="13" fill="#29252B">• outcome : VARCHAR(10) [CHK]</text>
    <text x="70" y="705" font-size="13" fill="#29252B">• fit_satisfaction : VARCHAR(10) [CHK]</text>
    <text x="70" y="730" font-size="13" fill="#29252B">• fit_preference : VARCHAR(20) [CHK]</text>
    <rect x="65" y="736" width="280" height="18" rx="3" fill="#F8F6F1"/>
    <text x="205" y="749" font-size="10.5" fill="#75466F" text-anchor="middle">Outcome: KEPT / RETURNED / EXCHANGED</text>
  </g>

  <!-- ================= ENTITY 8: FIT_REVIEW (Associative + Redis Vector Sync) ================= -->
  <g filter="url(#shadow)">
    <rect x="420" y="560" width="320" height="280" rx="8" fill="#FFFFFF" stroke="#DDA18E" stroke-width="2"/>
    <rect x="420" y="560" width="320" height="40" rx="8" fill="#DDA18E"/>
    <rect x="420" y="592" width="320" height="8" fill="#DDA18E"/>
    <text x="580" y="587" font-size="15" font-weight="bold" fill="#29252B" text-anchor="middle">FIT_REVIEW (Associative)</text>
    <text x="440" y="620" font-size="13" font-weight="bold" fill="#75466F">• review_id : INT [PK]</text>
    <text x="440" y="645" font-size="13" font-weight="bold" fill="#29252B">• user_id : INT [FK]</text>
    <text x="440" y="670" font-size="13" font-weight="bold" fill="#29252B">• garment_size_id : INT [FK]</text>
    <text x="440" y="695" font-size="13" fill="#29252B">• overall_fit : VARCHAR(20) [CHK]</text>
    <text x="440" y="720" font-size="13" fill="#29252B">• waist_fit, hip_fit, thigh_fit : VARCHAR(10)</text>
    <text x="440" y="745" font-size="13" fill="#29252B">• length_fit : VARCHAR(10) [CHK]</text>
    <text x="440" y="770" font-size="13" fill="#29252B">• review_text : TEXT [CHK: non-empty]</text>
    <text x="440" y="795" font-size="13" fill="#29252B">• created_at : TIMESTAMP</text>
    <rect x="435" y="805" width="290" height="26" rx="4" fill="#A7B7A0" fill-opacity="0.25"/>
    <text x="580" y="822" font-size="11" font-weight="bold" fill="#75466F" text-anchor="middle">⇄ Synchronized to Redis Vector Store (384d)</text>
  </g>

  <!-- ================= RELATIONSHIP CONNECTORS & LABELS ================= -->
  <!-- USER -> BODY_PROFILE (1 : 0..1) -->
  <line x1="330" y1="280" x2="420" y2="280" stroke="#75466F" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="345" y="265" width="60" height="20" rx="3" fill="#F8F6F1" stroke="#E8E2D8"/>
  <text x="375" y="279" font-size="11" font-weight="bold" fill="#75466F" text-anchor="middle">1 : 0..1</text>

  <!-- USER -> PURCHASE (1 : N) -->
  <line x1="160" y1="420" x2="160" y2="520" stroke="#75466F" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="135" y="455" width="50" height="20" rx="3" fill="#F8F6F1" stroke="#E8E2D8"/>
  <text x="160" y="469" font-size="11" font-weight="bold" fill="#75466F" text-anchor="middle">1 : N</text>

  <!-- USER -> FIT_REVIEW (1 : N) -->
  <path d="M 270 420 Q 270 590 420 590" fill="none" stroke="#75466F" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="300" y="505" width="50" height="20" rx="3" fill="#F8F6F1" stroke="#E8E2D8"/>
  <text x="325" y="519" font-size="11" font-weight="bold" fill="#75466F" text-anchor="middle">1 : N</text>

  <!-- BRAND -> GARMENT (1 : N) -->
  <line x1="1410" y1="360" x2="1410" y2="420" stroke="#75466F" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="1385" y="375" width="50" height="20" rx="3" fill="#F8F6F1" stroke="#E8E2D8"/>
  <text x="1410" y="389" font-size="11" font-weight="bold" fill="#75466F" text-anchor="middle">1 : N</text>

  <!-- GARMENT -> GARMENT_SIZE (1 : N) -->
  <line x1="1270" y1="510" x2="1150" y2="510" stroke="#75466F" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="1180" y="495" width="50" height="20" rx="3" fill="#F8F6F1" stroke="#E8E2D8"/>
  <text x="1205" y="509" font-size="11" font-weight="bold" fill="#75466F" text-anchor="middle">1 : N</text>

  <!-- GARMENT_SIZE -> GARMENT_MEASUREMENT (1 : N) -->
  <line x1="1000" y1="620" x2="1000" y2="700" stroke="#75466F" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="975" y="645" width="50" height="20" rx="3" fill="#F8F6F1" stroke="#E8E2D8"/>
  <text x="1000" y="659" font-size="11" font-weight="bold" fill="#75466F" text-anchor="middle">1 : N</text>

  <!-- GARMENT_SIZE -> PURCHASE (1 : N) -->
  <path d="M 850" d="M 850 510 L 780 510 L 780 490 L 360 490 L 360 550" fill="none" stroke="#29252B" stroke-dasharray="5,5" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="520" y="475" width="90" height="20" rx="3" fill="#F8F6F1" stroke="#E8E2D8"/>
  <text x="565" y="489" font-size="11" font-weight="bold" fill="#29252B" text-anchor="middle">purchased size (1:N)</text>

  <!-- GARMENT_SIZE -> FIT_REVIEW (1 : N) -->
  <line x1="850" y1="590" x2="740" y2="640" stroke="#29252B" stroke-dasharray="5,5" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="760" y="595" width="80" height="20" rx="3" fill="#F8F6F1" stroke="#E8E2D8"/>
  <text x="800" y="609" font-size="11" font-weight="bold" fill="#29252B" text-anchor="middle">reviewed size</text>

  <!-- Bottom Explanatory Notes Panel -->
  <rect x="50" y="940" width="1500" height="170" rx="8" fill="#F8F6F1" stroke="#E8E2D8" stroke-width="1.5"/>
  <text x="75" y="970" font-size="15" font-weight="bold" fill="#75466F">Formal Entity Classification &amp; Participation Constraints Rationale:</text>
  <text x="75" y="1000" font-size="13" fill="#29252B">1. <tspan font-weight="bold">Strong Entities (USER, BRAND, GARMENT):</tspan> Possess independent existence and autonomous surrogate primary keys (user_id, brand_id, garment_id).</text>
  <text x="75" y="1025" font-size="13" fill="#29252B">2. <tspan font-weight="bold">Dependent Subordinate Entities (BODY_PROFILE, GARMENT_SIZE, GARMENT_MEASUREMENT):</tspan> Subordinate lifecycle; GARMENT_SIZE discriminates size_label under garment_id (UQ); GARMENT_MEASUREMENT relies on garment_size_id with CASCADE deletion.</text>
  <text x="75" y="1050" font-size="13" fill="#29252B">3. <tspan font-weight="bold">Associative Entities (PURCHASE, FIT_REVIEW):</tspan> Model M:N interactions between USER and GARMENT_SIZE with historical outcomes, fit ratings, and natural-language text.</text>
  <text x="75" y="1075" font-size="13" fill="#29252B">4. <tspan font-weight="bold">Strict Cross-User Privacy Boundary:</tspan> Recommendation calibration queries only the authenticated user's private BODY_PROFILE and PURCHASE records. Community FIT_REVIEW text is analyzed solely for target garment fit consensus without accessing reviewer body profiles.</text>
</svg>
